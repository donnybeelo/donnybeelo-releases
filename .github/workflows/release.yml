name: Build and publish release

# Manual trigger: the manifest lives on gitlab.gnome.org, which GitHub cannot
# watch, so releasing is "pin the tag in the manifest, push, then run this".
#   gh workflow run release.yml -f manifest_ref=flathub-prep
on:
  # Fired by GitLab CI on a push to main (see .gitlab-ci.yml in
  # donnybeelo/convey), which passes the commit to build.
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      manifest_ref:
        description: Branch or tag of donnybeelo/convey to take the manifest from
        default: main
        required: true
      app_commit:
        description: Commit to build (blank = whatever the manifest pins)
        required: false
      label:
        description: Commit message for the published repo (e.g. "Convey 51.0")
        default: Rebuild
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

env:
  APP_ID: net.donnybeelo.Convey
  MANIFEST: net.donnybeelo.Convey.yml
  RUNTIME_VERSION: '50'

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu's flatpak-builder (1.4.3) has no --compose-url-policy; this
    # image ships a current one plus the GNOME 50 runtime.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: write
    steps:
      - name: Resolve inputs from either trigger
        run: |
          if [ "${{ github.event_name }}" = repository_dispatch ]; then
            echo "MANIFEST_REF=${{ github.event.client_payload.manifest_ref }}" >> "$GITHUB_ENV"
            echo "APP_COMMIT=${{ github.event.client_payload.app_commit }}"     >> "$GITHUB_ENV"
            echo "LABEL=${{ github.event.client_payload.label }}"               >> "$GITHUB_ENV"
          else
            echo "MANIFEST_REF=${{ inputs.manifest_ref }}" >> "$GITHUB_ENV"
            echo "APP_COMMIT=${{ inputs.app_commit }}"     >> "$GITHUB_ENV"
            echo "LABEL=${{ inputs.label }}"               >> "$GITHUB_ENV"
          fi

      - name: Check out the release repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git cannot track empty directories, so a fresh clone of the ostree
      # repo is missing refs/remotes, refs/mirrors, state and friends, and
      # ostree fails with "Listing refs: opendir(refs/remotes)".
      - name: Recreate ostree directories git cannot store
        run: mkdir -p refs/heads refs/mirrors refs/remotes state extensions tmp/cache

      - name: Install flatpak tooling
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the GNOME runtime and SDK
        run: |
          flatpak install --user -y --noninteractive --no-static-deltas flathub \
            org.gnome.Platform//${RUNTIME_VERSION} org.gnome.Sdk//${RUNTIME_VERSION}

      - name: Fetch the manifest
        run: |
          git clone --depth 1 --branch "$MANIFEST_REF" \
            https://gitlab.gnome.org/donnybeelo/convey.git src
          cp "src/${MANIFEST}" .

          # A push to main should publish that commit, not the tag the
          # manifest pins for reproducible release builds. Done with sed to
          # avoid depending on PyYAML being present on the runner.
          if [ -n "$APP_COMMIT" ]; then
            sed -i "/donnybeelo\/convey.git/,+2 {
              /^[[:space:]]*tag:/d
              s|^\([[:space:]]*\)commit: .*|\1commit: $APP_COMMIT|
            }" "${MANIFEST}"
            grep -q "commit: $APP_COMMIT" "${MANIFEST}" \
              || { echo "::error::failed to pin convey to $APP_COMMIT"; exit 1; }
          fi
          echo "Manifest from $MANIFEST_REF:"
          grep -A3 'donnybeelo/convey.git' "${MANIFEST}"

      # Building eds, folks and friends from source takes a long time; keep the
      # flatpak-builder cache between runs, keyed on the manifest itself.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: fb2-${{ runner.os }}-${{ hashFiles('net.donnybeelo.Convey.yml') }}
          restore-keys: fb2-${{ runner.os }}-

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set" && exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build and sign
        run: |
          # --compose-url-policy=full: without it the AppStream compose strips
          # external screenshot URLs and software centres show "No
          # Screenshots". Flathub mirrors them instead; a self-hosted repo
          # has to keep the upstream URLs.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --compose-url-policy=full \
            --repo=. --gpg-sign="$GPG_KEY" --default-branch=stable \
            build-dir "${MANIFEST}"

      - name: Drop the Debug extension
        run: |
          ARCH=$(flatpak --default-arch)
          ostree --repo=. refs --delete "runtime/${APP_ID}.Debug/${ARCH}/stable" || true

      - name: Update, prune and re-sign the repo
        run: |
          flatpak build-update-repo . \
            --title="Daniel Elia's Flatpaks" \
            --comment="Flatpak releases by Daniel Elia" \
            --homepage="https://donnybeelo.net" \
            --default-branch=stable \
            --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEY"

      # The site files must survive: build-update-repo does not touch them, but
      # a stray delete would silently unpublish the repo.
      - name: Sanity-check the site files
        run: |
          for f in CNAME .nojekyll index.html donnybeelo.flatpakrepo donnybeelo-key.asc; do
            [ -e "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          flatpak build-update-repo --help >/dev/null
          test -s summary && test -s summary.sig

      - name: Publish
        run: |
          rm -rf build-dir src "${MANIFEST}"
          # The container runs as root while the checkout is owned by the
          # runner user, so git refuses the repo without this.
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another publish may have landed while we were building (or the
          # checkout raced a replica). Never merge or rebase: the tree here is
          # a complete, regenerated ostree repo, and its deltas, summary and
          # refs conflict as unmergeable binaries. Reparent onto origin and
          # keep our tree wholesale instead.
          # ponytail: last publish wins; a version whose objects only existed
          # in the losing run is dropped. Union-merge objects/ if that matters.
          for try in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing changed; not committing."
              exit 0
            fi
            git commit -m "${LABEL:-Rebuild}"
            git push origin HEAD:main && exit 0
            git reset --soft HEAD^
          done
          echo "::error::origin kept moving; publish failed" && exit 1
