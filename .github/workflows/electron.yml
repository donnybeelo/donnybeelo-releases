name: Build and publish Electron app

on:
  repository_dispatch:
    types: [publish-electron]
  workflow_dispatch:
    inputs:
      repo:
        description: App repo to build
        required: true
        type: choice
        options:
          - donnybeelo/whatsapp-electron
          - donnybeelo/slack-electron
      commit:
        description: Commit to build (blank = main)
        required: false
      label:
        description: Commit message for the published repo (e.g. "Slack 1.0.0")
        default: Rebuild
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve inputs from either trigger
        run: |
          if [ "${{ github.event_name }}" = repository_dispatch ]; then
            REPO="${{ github.event.client_payload.repo }}"
            echo "COMMIT=${{ github.event.client_payload.commit }}" >> "$GITHUB_ENV"
            echo "LABEL=${{ github.event.client_payload.label }}"   >> "$GITHUB_ENV"
          else
            REPO="${{ inputs.repo }}"
            echo "COMMIT=${{ inputs.commit }}" >> "$GITHUB_ENV"
            echo "LABEL=${{ inputs.label }}"   >> "$GITHUB_ENV"
          fi
          case "$REPO" in
            donnybeelo/whatsapp-electron|donnybeelo/slack-electron) ;;
            *) echo "::error::refusing to build $REPO" && exit 1 ;;
          esac
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Check out the release repo
        uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0

      - name: Recreate ostree directories git cannot store
        run: mkdir -p refs/heads refs/mirrors refs/remotes state extensions tmp/cache

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.COMMIT || 'main' }}
          path: app

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ env.REPO }}-${{ hashFiles('app/bun.lock', 'app/package.json') }}
          restore-keys: electron-${{ env.REPO }}-

      - name: Install flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder ostree
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive --no-static-deltas flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.electronjs.Electron2.BaseApp//26.08

      - name: Build the flatpak bundle
        working-directory: app
        run: |
          bun install
          bun run dist:linux --publish=never

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set" && exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Sign into a scratch repo
        run: |
          ostree init --repo="${RUNNER_TEMP}/scratch-repo" --mode=archive-z2
          flatpak build-import-bundle --gpg-sign="$GPG_KEY" \
            "${RUNNER_TEMP}/scratch-repo" app/dist/*-x86_64.flatpak

      - name: Publish
        run: |
          rm -rf app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for try in 1 2 3; do
            git fetch origin pages
            git reset --hard FETCH_HEAD
            mkdir -p refs/heads refs/mirrors refs/remotes state extensions tmp/cache

            ostree --repo=. pull-local "${RUNNER_TEMP}/scratch-repo" \
              $(ostree --repo="${RUNNER_TEMP}/scratch-repo" refs)

            flatpak build-update-repo . \
              --title="Daniel Elia's Flatpaks" \
              --comment="Flatpak releases by Daniel Elia" \
              --homepage="https://donnybeelo.net" \
              --default-branch=nightly \
              --generate-static-deltas --prune \
              --gpg-sign="$GPG_KEY"

            for f in CNAME .nojekyll index.html donnybeelo.flatpakrepo donnybeelo-key.asc; do
              [ -e "$f" ] || { echo "::error::$f is missing"; exit 1; }
            done
            test -s summary && test -s summary.sig

            git add -A
            if git diff --cached --quiet; then
              echo "Nothing changed; not committing."
              exit 0
            fi
            git commit -m "${LABEL:-Rebuild} (x86_64)"
            git push origin HEAD:pages && exit 0
          done
          echo "::error::origin kept moving; publish failed" && exit 1
